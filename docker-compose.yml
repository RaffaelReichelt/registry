services:
  tailscale:
    image: tailscale/tailscale:stable
    hostname: registry2
    # containerboot liest den Auth Key nur aus der Umgebung, daher aus dem Secret exportieren.
    # Die Serve-Config wird beim Start erzeugt, damit der Stack ohne Begleitdateien
    # (z. B. im Portainer-Editor) deploybar ist. ${TS_CERT_DOMAIN} ersetzt containerboot selbst.
    entrypoint:
      - /bin/sh
      - -c
      - |
        export TS_AUTHKEY="$$(cat /run/secrets/ts_authkey)"
        cat > /tmp/serve.json <<'EOF'
        {
          "TCP": {"443": {"HTTPS": true}},
          "Web": {
            "$${TS_CERT_DOMAIN}:443": {
              "Handlers": {"/": {"Proxy": "http://registry:5000"}}
            }
          },
          "AllowFunnel": {"$${TS_CERT_DOMAIN}:443": false}
        }
        EOF
        exec /usr/local/bin/containerboot
    environment:
      TS_HOSTNAME: registry2
      TS_STATE_DIR: /var/lib/tailscale
      TS_USERSPACE: "true"
      TS_SERVE_CONFIG: /tmp/serve.json
    secrets:
      - ts_authkey
    volumes:
      - tailscale-state:/var/lib/tailscale
    networks:
      - registry
    deploy:
      replicas: 1
      restart_policy:
        condition: any
      placement:
        constraints:
          - node.labels.registry == true

  registry:
    image: registry:2
    environment:
      REGISTRY_HTTP_ADDR: 0.0.0.0:5000
      REGISTRY_STORAGE_DELETE_ENABLED: "true"
    volumes:
      - registry-data:/var/lib/registry
    networks:
      - registry
    deploy:
      replicas: 1
      restart_policy:
        condition: any
      placement:
        constraints:
          - node.labels.registry == true

networks:
  registry:
    driver: overlay

volumes:
  tailscale-state:
  registry-data:

secrets:
  ts_authkey:
    external: true
