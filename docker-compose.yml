services:
  tailscale:
    image: tailscale/tailscale:stable
    hostname: registry2
    environment:
      TS_AUTHKEY: ${TS_AUTHKEY}
      TS_HOSTNAME: registry2
      TS_STATE_DIR: /var/lib/tailscale
      TS_USERSPACE: "true"
      TS_SERVE_CONFIG: /config/serve.json
    configs:
      - source: registry_serve
        target: /config/serve.json
    volumes:
      - tailscale-state:/var/lib/tailscale
    networks:
      - registry
    deploy:
      replicas: 1
      restart_policy:
        condition: any
      placement:
        constraints:
          - node.labels.registry == true

  registry:
    image: registry:2
    environment:
      REGISTRY_HTTP_ADDR: 0.0.0.0:5000
      REGISTRY_STORAGE_DELETE_ENABLED: "true"
    volumes:
      - registry-data:/var/lib/registry
    networks:
      - registry
    deploy:
      replicas: 1
      restart_policy:
        condition: any
      placement:
        constraints:
          - node.labels.registry == true

networks:
  registry:
    driver: overlay

volumes:
  tailscale-state:
  registry-data:

configs:
  registry_serve:
    # Bei Änderung an serve.json den Namen erhöhen (…_v2), Swarm-Configs sind unveränderlich.
    name: registry_serve_v1
    file: ./tailscale/serve.json
